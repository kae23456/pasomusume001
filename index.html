<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
<!--  <meta http-equiv="refresh" content="10"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>試合動画アーカイブ</title>
  <!-- Cookieチェック処理（ページの描画前に即座に実行する） -->
  <script>
    function getCookie(name) {
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i].trim();
        if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }

    // Cookieが無い場合はトップページ（認証画面）へ強制リダイレクト
    if (getCookie("site_authenticated") !== "true") {
      alert("閲覧には認証が必要です。");
      window.location.href = "index.html";
    }
  </script>
  
  <style>
    /* 全体スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
  
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
      line-height: 1.6;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    /* フィルターエリア */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 30px;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-weight: bold;
      font-size: 0.9rem;
    }
    select {
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      background-color: #fff;
    }

    /* 動画グリッド表示 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .video-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9のアスペクト比 */
      height: 0;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-info {
      padding: 15px;
      flex-grow: 1;
    }
    .video-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background: #eef2f5;
      color: #555;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    /* 該当動画なしメッセージ */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>静岡大学ラグビー部　試合動画アーカイブ</h1>
    <p>なんと絞り込みで動画を探せます</p>
  </header>

  <!-- 絞り込みフィルター部分 -->
  <div class="filter-container">
    <div class="filter-group">
      <label for="yearFilter">年度:</label>
      <select id="yearFilter">
        <option value="all">すべて</option>
        <option value="2026">2026年度</option>
        <option value="2025">2025年度</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="opponentFilter">対戦相手:</label>
      <select id="opponentFilter">
        <option value="all">すべて</option>
        <option value="A大学">A大学</option>
        <option value="B大学">B大学</option>
        <option value="C高校">C高校</option>
      </select>
    </div>
  </div>

  <!-- 動画一覧出力エリア -->
  <div id="videoGrid" class="video-grid"></div>

  <script>
    // 1. 動画データ定義（YouTubeの動画IDを設定）
    const videos = [
      {
        id: "0BYBRf42wWI", // YouTubeの動画ID
        title: "2025年 リーグ戦 vs 名古屋大学",
        year: "2025",
        opponent: "名古屋大学",
        tags: ["リーグ戦"]
      },
      {
        id: "VgCCOsXza6c",
        title: "2025年 リーグ戦 vs 愛知淑徳大学",
        year: "2025",
        opponent: "愛知淑徳大学",
        tags: ["リーグ戦"]
      },
/*      {
        id: "dQw4w9WgXcQ",
        title: "2025年 秋季大会 vs C高校 決勝",
        year: "2025",
        opponent: "C高校",
        tags: ["公式戦", "決勝"]
      } */
    ];

    // DOM要素の取得
    const yearFilter = document.getElementById("yearFilter");
    const opponentFilter = document.getElementById("opponentFilter");
    const videoGrid = document.getElementById("videoGrid");

    // 2. フィルタリング＆描画関数
    function renderVideos() {
      const selectedYear = yearFilter.value;
      const selectedOpponent = opponentFilter.value;

      // 配列の絞り込み処理
      const filteredVideos = videos.filter(video => {
        const matchesYear = (selectedYear === "all" || video.year === selectedYear);
        const matchesOpponent = (selectedOpponent === "all" || video.opponent === selectedOpponent);
        return matchesYear && matchesOpponent;
      });

      // 画面（HTML）への表示処理
      videoGrid.innerHTML = "";

      if (filteredVideos.length === 0) {
        videoGrid.innerHTML = '<div class="no-results">該当する動画が見つかりませんでした。</div>';
        return;
      }

      filteredVideos.forEach(video => {
        const card = document.createElement("div");
        card.className = "video-card";

        // タグのHTML生成
        const tagsHtml = video.tags.map(tag => `<span class="tag">#${tag}</span>`).join("");

        card.innerHTML = `
          <div class="video-wrapper">
            <iframe 
              src="https://www.youtube.com/embed/${video.id}" 
              title="${video.title}" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="tag-list">
              <span class="tag">${video.year}年</span>
              <span class="tag">vs ${video.opponent}</span>
              ${tagsHtml}
            </div>
          </div>
        `;

        videoGrid.appendChild(card);
      });
    }

    // 3. イベントリスナーの設定（ドロップダウン変更時に再描画）
    yearFilter.addEventListener("change", renderVideos);
    opponentFilter.addEventListener("change", renderVideos);

    // 初期表示
    renderVideos();
  </script>
</body>
</html>
